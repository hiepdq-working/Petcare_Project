server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real static file falls back to
    # index.html so React Router can handle client-side routes like
    # /pets/:id directly (otherwise a hard refresh on a deep link 404s).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
